<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#971cd0" />
    <title>Pas de réseau — Kaddie</title>
    <style>
      /* Page servie hors connexion : autonome, couleurs de tokens.css recopiées ici. */
      :root { --violet: #971cd0; --aubergine: #540472; --blanc: #ffffff; }
      @font-face { font-family: "BoldenVan"; src: url("/fonts/BoldenVan.ttf") format("truetype"); font-display: swap; }
      body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
             padding: max(env(safe-area-inset-top), 48px) 24px max(env(safe-area-inset-bottom), 32px); box-sizing: border-box;
             background: var(--violet); color: var(--blanc); font-family: system-ui, -apple-system, sans-serif; }
      img { width: 120px; }
      h1 { font-family: "BoldenVan", system-ui, sans-serif; font-weight: 400; font-size: 48px; line-height: 1; margin: 24px 0 12px; }
      p { font-size: 17px; line-height: 24px; margin: 0; max-width: 320px; }
      button { min-height: 56px; width: 100%; font-family: "BoldenVan", system-ui, sans-serif; font-size: 20px; color: var(--aubergine);
               background: var(--blanc); border: 0; border-radius: 18px; }
      button:active, a.liste:active { transform: scale(0.96); }
      .actions { display: flex; flex-direction: column; gap: 12px; }
      a.liste { display: flex; align-items: center; justify-content: center; min-height: 56px; font-family: "BoldenVan", system-ui, sans-serif;
                font-size: 20px; color: var(--aubergine); background: #aaf951; border-radius: 18px; text-decoration: none; }
      a.liste[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div>
      <img src="/brand/logo/kaddie-logo-blanc.svg" alt="Kaddie" />
      <h1>Pas de réseau</h1>
      <p>Vérifie le wifi ou les données mobiles, puis réessaie.</p>
    </div>
    <div class="actions">
      <!-- La dernière liste de courses, gardée sur le téléphone : consultable et cochable sans réseau. -->
      <a id="liste" class="liste" href="/courses" hidden>Voir la liste de courses</a>
      <button onclick="location.reload()">Réessayer</button>
    </div>
    <script>
      caches.open("kaddie-pages-v1").then((c) => c.match("/courses", { ignoreVary: true })).then((r) => {
        if (r) document.getElementById("liste").hidden = false;
      }).catch(() => {});
    </script>
  </body>
</html>
